server:
    port: ${PORT:8080}

spring:
    application:
        name: veterinaria

    datasource:
        url: jdbc:postgresql://${DB_HOST}/${DB_NAME}?sslmode=require
        username: ${DB_USER}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: none
        show-sql: true
        open-in-view: true
        properties:
            hibernate:
                format_sql: true

    jackson:
        time-zone: America/Bogota

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html
        operationsSorter: method
        tryItOutEnabled: true
    packages-to-scan: co.edu.iub.veterinaria.controller
    show-actuator: false

logging:
    level:
        web: DEBUG
        org.springframework.web: DEBUG

app:
    jwt:
        secret: ${JWT_SECRET:this-is-a-dev-secret-must-be-at-least-32-bytes}
        expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}

    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
